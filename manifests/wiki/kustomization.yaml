apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - wikijs_postgresql.yaml
  - wikijs_env.yaml
  - wikijs_deployment.yaml
  - wikijs_service.yaml
  - wikijs_ingress.yaml
  - wikijs_vpa.yaml
  - wikijs_bootstrap.yaml
# Hashing the script into the ConfigMap name is what makes the Job re-run:
# editing bootstrap.py changes the name, which changes the Job spec, which
# Flux then recreates.
configMapGenerator:
  - name: wikijs-bootstrap-script
    namespace: wiki
    files:
      - bootstrap.py
