apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikijs
  namespace: wiki
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/instance: wiki
    app.kubernetes.io/name: wikijs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: wiki
      app.kubernetes.io/name: wikijs
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: wiki
        app.kubernetes.io/name: wikijs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wikijs
          image: ghcr.io/requarks/wiki:2.5.314
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: wikijs-env
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # /healthz returns 503 when the database pool has no connections.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          # First boot creates the schema and sideloads locales, which is well
          # past the liveness threshold.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /wiki/data
      volumes:
        # Pages and uploaded assets live in Postgres; this path is only the
        # regenerable asset cache, so it does not need a PVC or a backup.
        - name: data
          emptyDir: {}
