apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: campaign-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-core-10-infrastructure-configs
  interval: 10m
  path: ./manifests/campaign-manager
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-values
      - kind: Secret
        name: flux-secrets
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
