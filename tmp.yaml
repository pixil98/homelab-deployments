apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgresql-test
  namespace: photos
spec:
  instances: 1
  imageName: registry.lab.reisman.org/proxy.ghcr.io/tensorchord/cloudnative-pgvecto.rs:17
  postgresql:
    shared_preload_libraries:
      - "vectors.so"
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-postgresql-user
      dataChecksums: true
      postInitApplicationSQL:
        - ALTER SYSTEM SET search_path TO "$user", public, vectors;
        - CREATE EXTENSION IF NOT EXISTS cube
        - CREATE EXTENSION IF NOT EXISTS earthdistance
        - CREATE EXTENSION IF NOT EXISTS vectors
        - GRANT USAGE ON SCHEMA vectors TO immich
        - GRANT SELECT ON ALL TABLES IN SCHEMA vectors TO immich
  storage:
    storageClass: nfs-client-nobackup
    size: 1Gi
