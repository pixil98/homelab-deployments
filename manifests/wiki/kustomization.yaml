apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - dokuwiki_config.yaml
  - dokuwiki_serviceaccount.yaml
  - dokuwiki_pvc.yaml
  - dokuwiki_deployment.yaml
  - dokuwiki_service.yaml
  - dokuwiki_ingress.yaml
  - dokuwiki_vpa.yaml
  - volsync_replication.yaml
# Hashing these into the ConfigMap name rolls the Deployment whenever either
# changes, so a new plugin pin or ACL rule is applied by the next init run.
configMapGenerator:
  - name: dokuwiki-storage
    namespace: wiki
    files:
      - prepare-storage.sh
      - acl.auth.php
