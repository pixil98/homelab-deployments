# BookStack is MySQL-only, so this namespace runs its own MariaDB rather than
# using the cluster's CloudNativePG operator.
apiVersion: v1
kind: Secret
metadata:
  name: wiki-mariadb
  namespace: wiki
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: "${secrets_apps_wiki_mariadb_rootPassword}"
  MARIADB_DATABASE: bookstack
  MARIADB_USER: bookstack
  MARIADB_PASSWORD: "${secrets_apps_wiki_mariadb_password}"
