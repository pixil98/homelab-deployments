# authentik OAuth2 provider for campaign-manager's callers. A caller sends an
# access token from this provider, and the service reads their roles from its
# campaigns and mapper_admin claims (see manifests/campaign-manager/README.md).
#
# Callers log in with mpr, the service's command line, through the device code
# grant: mpr prints a link, the person logs in there, and mpr keeps a refresh
# token. Add authorization_code, with redirect URIs, once something has a login
# page to send people to.
# Discovery: https://auth.${vals_info_cluster_domain}/application/o/campaign-manager/.well-known/openid-configuration
apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-campaign-manager-provider
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  campaign-manager-provider.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Campaign manager provider
    entries:
      # Its own copy of Mapper's campaigns claim rather than a !Find into
      # mapper_provider.yaml, so neither blueprint depends on the other's apply
      # order. Built from the groups' attributes, the record of who is in what,
      # and filtered to mapper groups like the others, to bound token size.
      - model: authentik_providers_oauth2.scopemapping
        id: scope_campaigns
        identifiers: { name: "Campaign manager - campaigns" }
        state: present
        attrs:
          name: "Campaign manager - campaigns"
          scope_name: campaigns
          description: "Your campaigns, and your role in each"
          expression: |
            # all_groups() walks ancestors, as the other mappings do.
            campaigns = {}
            is_admin = False
            for group in request.user.all_groups():
                if group.name != "mapper" and not group.name.startswith("mapper-"):
                    continue
                attrs = group.attributes or {}
                slug, role = attrs.get("campaign"), attrs.get("role")
                if role == "admin" and not slug:
                    is_admin = True
                elif slug and role:
                    campaigns.setdefault(slug, set()).add(role)
            return {
                "campaigns": {s: sorted(r) for s, r in campaigns.items()},
                "mapper_admin": is_admin,
            }

      - model: authentik_providers_oauth2.oauth2provider
        id: campaign_manager_provider
        identifiers: { name: campaign-manager }
        state: present
        attrs:
          name: campaign-manager
          # Public: mpr runs on people's own machines, so it cannot keep a
          # client secret. client_credentials stays off, since its built-in
          # path makes up a user for whoever presents the client secret.
          client_type: public
          # Not a secret for this provider; the service checks tokens were
          # issued to it, and tells mpr it through GET /auth.
          client_id: campaign-manager
          grant_types:
            - urn:ietf:params:oauth:grant-type:device_code
            - refresh_token
          # Required even though the device code grant never redirects; add
          # the UI's callback here along with authorization_code.
          redirect_uris: []
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # Asymmetric, so the service verifies tokens against the published
          # keys and never needs a secret of the provider's.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, auth.${vals_info_cluster_domain}]]
          sub_mode: hashed_user_id
          # authentik only puts scope claims in access tokens with this on,
          # and the service reads roles from the access token.
          include_claims_in_id_token: true
          # Roles are read from the token, so its life is how long someone
          # removed as an officer can still invite. A refresh reads them anew.
          access_token_validity: minutes=5
          # How long a device login waits for the person to finish in their
          # browser. The default minute is too short.
          access_code_validity: minutes=10
          # How long mpr stays logged in without being used.
          refresh_token_validity: days=30
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
            - !KeyOf scope_campaigns

      - model: authentik_core.application
        id: campaign_manager_application
        identifiers: { slug: campaign-manager }
        state: present
        attrs:
          name: Campaign manager
          slug: campaign-manager
          provider: !KeyOf campaign_manager_provider
          # An API, not something to open: blank://blank keeps it out of the
          # app library.
          meta_launch_url: blank://blank
          policy_engine_mode: any

      # Anyone on the platform may have a token. What they can do with it is
      # the service's decision, made per campaign.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf campaign_manager_application
          group: !Find [authentik_core.group, [name, mapper]]
          order: 0
        state: present
        attrs:
          enabled: true

      # authentik's device page, where a device login's link leads, answers 404
      # unless the brand has a device code flow. The flow only asks for the
      # code when the link lacks it; authentik adds that stage itself, then
      # sends the person through the provider's own login and authorization,
      # so the flow is empty and needs no login of its own.
      - model: authentik_flows.flow
        id: device_code_flow
        identifiers: { slug: device-code }
        state: present
        attrs:
          name: Device code
          slug: device-code
          title: Log in on another device
          designation: stage_configuration
          authentication: none

      # Only the device code flow is set, so the default brand blueprint, which
      # creates the brand and nothing after, keeps the rest.
      - model: authentik_brands.brand
        identifiers: { domain: authentik-default }
        state: present
        attrs:
          flow_device_code: !KeyOf device_code_flow
