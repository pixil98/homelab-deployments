# Temporary second-domain registration for the production cluster.
#
# The cluster Terraform module renders exactly one domain per cluster, from
# info.cluster.domain in that cluster's values.json. The production cluster
# serves reisman.org (generated, routes/production) and zingde.com (here) until
# zingde.com moves to its own cluster, at which point this directory and
# flux/registrations/production-zingde.yaml are deleted together.
#
# Hand-maintained on purpose: Terraform owns only routes/production and
# flux/registrations/production.yaml, so it will not overwrite these files.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: production-zingde
  namespace: routing
spec:
  dnsNames:
    - zingde.com
    - "*.zingde.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production-cloudflare
  privateKey:
    rotationPolicy: Always
  secretName: production-zingde-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: production-zingde
  namespace: routing
spec:
  gatewayClassName: routing
  listeners:
    - hostname: zingde.com
      name: http-apex
      port: 80
      protocol: HTTP
    - hostname: "*.zingde.com"
      name: http-wildcard
      port: 80
      protocol: HTTP
    - hostname: zingde.com
      name: https-apex
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: production-zingde-tls
        mode: Terminate
    - hostname: "*.zingde.com"
      name: https-wildcard
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: production-zingde-tls
        mode: Terminate
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: production-zingde
  namespace: routing
spec:
  endpoints:
    - ip:
        address: 192.168.2.12
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: production-zingde-http-redirect
  namespace: routing
spec:
  hostnames:
    - zingde.com
    - "*.zingde.com"
  parentRefs:
    - name: production-zingde
      sectionName: http-apex
    - name: production-zingde
      sectionName: http-wildcard
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: production-zingde-https
  namespace: routing
spec:
  hostnames:
    - zingde.com
    - "*.zingde.com"
  parentRefs:
    - name: production-zingde
      sectionName: https-apex
    - name: production-zingde
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: production-zingde
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: production-zingde
  namespace: routing
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: production-zingde
      sectionName: "443"
  validation:
    # SNI and certificate validation for the hop to the production ingress.
    # This is deliberately not the apex: the production nginx ingress holds a
    # publicly trusted certificate for mapper.zingde.com only, and its default
    # certificate covers reisman.org. Sending SNI "zingde.com" would make nginx
    # answer with the reisman.org default certificate and validation would fail.
    # Envoy preserves the client Host header, so nginx still selects the right
    # virtual host for every *.zingde.com name behind this single SNI value.
    hostname: mapper.zingde.com
    wellKnownCACertificates: System
