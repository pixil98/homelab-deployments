apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ugre
  namespace: routing
spec:
  dnsNames:
    - onioncartography.com
    - "*.onioncartography.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production-cloudflare
  privateKey:
    rotationPolicy: Always
  secretName: ugre-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ugre
  namespace: routing
spec:
  gatewayClassName: routing
  listeners:
    - hostname: onioncartography.com
      name: http-apex
      port: 80
      protocol: HTTP
    - hostname: "*.onioncartography.com"
      name: http-wildcard
      port: 80
      protocol: HTTP
    - hostname: onioncartography.com
      name: https-apex
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: ugre-tls
        mode: Terminate
    - hostname: "*.onioncartography.com"
      name: https-wildcard
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: ugre-tls
        mode: Terminate
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ugre
  namespace: routing
spec:
  appProtocols:
    - gateway.envoyproxy.io/wss
  endpoints:
    - ip:
        address: 192.168.2.220
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ugre-http-redirect
  namespace: routing
spec:
  hostnames:
    - onioncartography.com
    - "*.onioncartography.com"
  parentRefs:
    - name: ugre
      sectionName: http-apex
    - name: ugre
      sectionName: http-wildcard
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ugre-https
  namespace: routing
spec:
  hostnames:
    - onioncartography.com
    - "*.onioncartography.com"
  parentRefs:
    - name: ugre
      sectionName: https-apex
    - name: ugre
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: ugre
          port: 443
      # This catch-all route fronts streaming and other long-running services.
      # Disable Envoy's 15s total request timeout; its stream idle timeout still
      # terminates stalled streams.
      timeouts:
        request: "0s"
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: ugre
  namespace: routing
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: ugre
      sectionName: "443"
  validation:
    hostname: onioncartography.com
    wellKnownCACertificates: System
