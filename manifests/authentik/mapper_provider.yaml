# authentik OIDC provider: Mapper delegates login here.
# Mapper redirect URI: https://${vals_info_cluster_domain}/api/login/callback
# Discovery: https://auth.${vals_info_cluster_domain}/application/o/mapper/.well-known/openid-configuration
apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-mapper-provider
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  mapper-provider.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Mapper provider
    entries:
      # Base group: parent of every Mapper role/campaign group. The app binding
      # targets this one, so any descendant grants access (authentik counts
      # child-group members as members of the parent). Per-campaign role groups
      # live in their own blueprint (see mapper_epic) and parent to this.
      - model: authentik_core.group
        id: group_mapper
        identifiers: { name: mapper }
        state: present
        attrs:
          name: mapper

      # Cluster-wide Mapper super-admin (no campaign slug).
      - model: authentik_core.group
        id: group_mapper_admin
        identifiers: { name: mapper-admin }
        state: present
        attrs:
          name: mapper-admin
          parents: [ !KeyOf group_mapper ]

      # authentik's default "profile" mapping happens to include groups, but
      # Mapper's entire access control depends on that claim, so it gets an
      # explicit scope rather than riding on a default that could change.
      - model: authentik_providers_oauth2.scopemapping
        id: scope_mapper_groups
        identifiers: { name: "Mapper - groups" }
        state: present
        attrs:
          name: "Mapper - groups"
          scope_name: groups
          description: "Groups you belong to (Mapper grants access based on these)"
          expression: |
            return {
                "groups": [group.name for group in request.user.ak_groups.all()],
            }

      - model: authentik_providers_oauth2.oauth2provider
        id: mapper_provider
        identifiers: { name: mapper }
        state: present
        attrs:
          name: mapper
          client_type: confidential
          client_id: ${secrets_apps_auth_applications_mapper_clientId}
          client_secret: ${secrets_apps_auth_applications_mapper_clientSecret}
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # An asymmetric signing key makes authentik issue RS256 ID tokens,
          # which Mapper verifies against the published JWKS. Same certificate
          # every other blueprint in this cluster signs with.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, auth.${vals_info_cluster_domain}]]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://${vals_info_cluster_domain}/api/login/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !KeyOf scope_mapper_groups

      - model: authentik_core.application
        id: mapper_application
        identifiers: { slug: mapper }
        state: present
        attrs:
          name: Mapper
          slug: mapper
          provider: !KeyOf mapper_provider
          meta_launch_url: https://${vals_info_cluster_domain}/
          meta_description: Social mapping for organizing campaigns
          # "any" so holding either campaign group is enough to pass the
          # bindings below. Without bindings authentik would let every user
          # reach the app and leave Mapper to reject them.
          policy_engine_mode: any

      # One binding on the base group gates the app; every role/campaign group
      # descends from it. Mapper enforces access too, so this is defence in
      # depth: it stops authentik issuing codes to users it would only reject
      # and keeps the app off their dashboard.
      - model: authentik_policies.policybinding
        id: binding_mapper
        identifiers:
          target: !KeyOf mapper_application
          group: !KeyOf group_mapper
          order: 0
        state: present
        attrs:
          enabled: true
