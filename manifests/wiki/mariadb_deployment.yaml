apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-mariadb
  namespace: wiki
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/instance: wiki
    app.kubernetes.io/name: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: wiki
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: wiki
        app.kubernetes.io/name: mariadb
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: docker.io/mariadb:11.8.8
          imagePullPolicy: IfNotPresent
          # BookStack needs utf8mb4 end to end; 11.8 already defaults to it, set
          # explicitly so a future image default cannot silently change it.
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          envFrom:
            - secretRef:
                name: wiki-mariadb
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          # --su-mysql connects over the unix socket as the mysql user, so the
          # probe needs no credentials.
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wiki-mariadb-data
