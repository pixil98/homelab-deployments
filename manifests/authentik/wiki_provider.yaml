# authentik OIDC provider: DokuWiki's oauth plugin delegates login here.
# The plugin's callback is doku.php itself, pinned in
# manifests/wiki/dokuwiki_config.yaml so the strict match below holds.
# Discovery: https://auth.${vals_info_cluster_domain}/application/o/wiki/.well-known/openid-configuration
apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-wiki-provider
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  wiki-provider.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Wiki provider
    entries:
      # Its own copy of the groups scope rather than a !Find into
      # mapper_provider.yaml, so neither blueprint depends on the other's apply
      # order. Flat names only - DokuWiki's ACL rules name groups as plain
      # strings, and the oauth plugin reads a list of them.
      #
      # The claim is "wiki_groups", not "groups", because authentik's stock
      # profile mapping, which the wiki also requests, already emits a direct-only
      # "groups", and claims from every granted scope are merged. Two mappings
      # writing the same key would leave the winner down to processing order.
      # DokuWiki is pointed at this key through the oauthgeneric json-grps
      # setting, so the stock claim is simply ignored.
      - model: authentik_providers_oauth2.scopemapping
        id: scope_wiki_groups
        identifiers: { name: "Wiki - groups" }
        state: present
        attrs:
          name: "Wiki - groups"
          scope_name: groups
          description: "Groups you belong to (the wiki grants access based on these)"
          expression: |
            # all_groups() walks ancestors; the base "mapper" group grants the handbook.
            groups = [
                g for g in request.user.all_groups().order_by("name")
                if g.name == "mapper" or g.name.startswith("mapper-")
            ]
            return {
                "wiki_groups": [g.name for g in groups],
            }

      - model: authentik_providers_oauth2.oauth2provider
        id: wiki_provider
        identifiers: { name: wiki }
        state: present
        attrs:
          name: wiki
          client_type: confidential
          # Same reason as the mapper provider: authentik rejects every
          # authorize request whose grant type is not listed explicitly.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: ${secrets_apps_auth_applications_wiki_clientId}
          client_secret: ${secrets_apps_auth_applications_wiki_clientSecret}
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          # Implicit consent: wiki is our own app, so don't prompt to authorize it.
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, auth.${vals_info_cluster_domain}]]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://wiki.${vals_info_cluster_domain}/doku.php
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            # The refresh token this grants is how the wiki re-reads a session's
            # groups every few minutes, so a removal here reaches it without a
            # fresh login.
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
            # DokuWiki reads groups from the userinfo endpoint, so this scope has
            # to be in its requested scopes as well as here.
            - !KeyOf scope_wiki_groups

      - model: authentik_core.application
        id: wiki_application
        identifiers: { slug: wiki }
        state: present
        attrs:
          name: Wiki
          slug: wiki
          provider: !KeyOf wiki_provider
          meta_launch_url: https://wiki.${vals_info_cluster_domain}/
          meta_description: Campaign wikis, one section per campaign
          icon: icons/dokuwiki.svg
          policy_engine_mode: any

      # Bound to the same base "mapper" group as the Mapper app: every campaign
      # role group descends from it, so anyone in any campaign can log in. Which
      # campaign sections they can actually read is decided by DokuWiki ACL
      # rules on these same authentik group names.
      - model: authentik_policies.policybinding
        id: binding_wiki
        identifiers:
          target: !KeyOf wiki_application
          group: !Find [authentik_core.group, [name, mapper]]
          order: 0
        state: present
        attrs:
          enabled: true
