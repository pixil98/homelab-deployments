# authentik OAuth source: delegate login to Google.
# Google OAuth client redirect URI: https://auth.${vals_info_cluster_domain}/source/oauth/callback/google/
apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-google-source
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  google-source.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Google source
    entries:
      # Blueprints apply concurrently, so force the flows this source references
      # to exist before !Find runs against them.
      - model: authentik_blueprints.metaapplyblueprint
        identifiers: { name: "Default - Source authentication flow" }
        attrs: { required: true }
      - model: authentik_blueprints.metaapplyblueprint
        identifiers: { name: "Default - Source enrollment flow" }
        attrs: { required: true }

      - model: authentik_sources_oauth.oauthsource
        id: google_source
        identifiers: { slug: google }
        state: present
        attrs:
          name: Google
          slug: google
          enabled: true
          provider_type: google
          consumer_key: ${secrets_apps_auth_sources_google_clientId}
          consumer_secret: ${secrets_apps_auth_sources_google_clientSecret}
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          user_matching_mode: email_link
