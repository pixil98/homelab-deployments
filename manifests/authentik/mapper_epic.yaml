# authentik groups for the "epic" Mapper campaign.
# Campaign and role come from each group's attributes, not from the name — the
# name is a label that Wiki.js matches on. Renaming a group reassigns every
# member, so treat these as stable.
#
# Both parent to the base "mapper" group (in mapper_provider), so the single app
# binding there gates access — no per-group bindings needed here.
#
# Reference copy: once the campaign service exists it creates these over the
# authentik API rather than adding a blueprint per campaign.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-mapper-epic
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  mapper-epic.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Mapper epic
    entries:
      - model: authentik_core.group
        id: group_mapper_epic_mapper
        identifiers: { name: mapper-epic-mapper }
        state: present
        attrs:
          name: mapper-epic-mapper
          parents: [ !Find [authentik_core.group, [name, mapper]] ]
          attributes:
            campaign: epic
            role: mapper

      - model: authentik_core.group
        id: group_mapper_epic_officer
        identifiers: { name: mapper-epic-officer }
        state: present
        attrs:
          name: mapper-epic-officer
          parents: [ !Find [authentik_core.group, [name, mapper]] ]
          attributes:
            campaign: epic
            role: officer
